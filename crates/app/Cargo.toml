[package]
name = "spool"
description = "Manage network printers and scanners"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
spool-protocols = { path = "../protocols" }
spool-services = { path = "../services" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
